services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: seldon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seldon}
      POSTGRES_DB: seldonframe

    command:
      - postgres
      - -c
      - wal_level=logical

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U seldon -d seldonframe"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    restart: unless-stopped

    environment:
      PG_CONNECTION_STRING: postgres://seldon:${POSTGRES_PASSWORD:-seldon}@postgres:5432/seldonframe

    expose:
      - "4444"

    depends_on:
      postgres:
        condition: service_healthy


  migrate:
    build:
      context: .

    image: seldonframe-app

    command:
      - sh
      - scripts/docker-migrate.sh

    environment:
      DATABASE_URL: postgres://seldon:${POSTGRES_PASSWORD:-seldon}@postgres:5432/seldonframe

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  app:
    build:
      context: .

    image: seldonframe-app

    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://seldon:${POSTGRES_PASSWORD:-seldon}@postgres:5432/seldonframe

      NEON_LOCAL_HOST: neon-proxy
      NEON_LOCAL_PORT: "4444"

      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

      PORT: "8080"

      # Add your application/LLM variables here
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

    expose:
      - "8080"

    depends_on:
      neon-proxy:
        condition: service_started

      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/api/version || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


volumes:
  pgdata: